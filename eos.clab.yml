name: eos-tm
prefix: ""
mgmt:
  network: eos-tm
  ipv4-subnet: 172.80.80.0/24
  ipv6-subnet: ""

topology:
  defaults:
    kind: arista_ceos

  kinds:
    arista_ceos:
      image: ceos:4.35.1F
      # startup-config: eos-base.cfg
      env:
        CLAB_MGMT_VRF: MGMT
      binds:
        - interfaces.json:/mnt/flash/EosIntfMapping.json:ro
    linux:
      image: ghcr.io/srl-labs/network-multitool

  nodes:
    ### FABRIC ###
    cfsa-cnt1-0001:
      kind: arista_ceos
      startup-config: configs/fabric/cfsa-cnt1-0001.cfg
      mgmt-ipv4: 172.80.80.21
    cfsa-cnt1-0002:
      kind: arista_ceos
      startup-config: configs/fabric/cfsa-cnt1-0002.cfg
      mgmt-ipv4: 172.80.80.22
    cfsa-cnt1-0201a:
      kind: arista_ceos
      startup-config: configs/fabric/cfsa-cnt1-0201a.cfg
      mgmt-ipv4: 172.80.80.11
    cfsa-cnt1-0201b:
      kind: arista_ceos
      startup-config: configs/fabric/cfsa-cnt1-0201b.cfg
      mgmt-ipv4: 172.80.80.12
    #cfsa-cnt1-0202a:
      #kind: arista_ceos
      #startup-config: configs/fabric/cfsa-cnt1-0202a.cfg
      #mgmt-ipv4: 172.80.80.13
    #cfsa-cnt1-0202b:
      #kind: arista_ceos
      #startup-config: configs/fabric/cfsa-cnt1-0202b.cfg
      #mgmt-ipv4: 172.80.80.14

    ### CLIENTS ###
    client1:
      kind: linux
      mgmt-ipv4: 172.80.80.31
      exec:
        - ip address add 172.17.0.1/24 dev eth1
        - ip -6 address add 2002::172:17:0:1/96 dev eth1
        - iperf3 -s -p 5201 -D > iperf3_1.log
        - iperf3 -s -p 5202 -D > iperf3_2.log
      group: server
    client2:
      kind: linux
      mgmt-ipv4: 172.80.80.32
      binds:
        - configs/client2:/config
      exec:
        - ip address add 172.17.0.2/24 dev eth1
        - ip -6 address add 2002::172:17:0:2/96 dev eth1
      group: server
    #client3:
      #kind: linux
      #mgmt-ipv4: 172.80.80.33
      #binds:
        #- configs/client3:/config
      #exec:
        #- ip address add 172.17.0.3/24 dev eth1
        #- ip -6 address add 2002::172:17:0:3/96 dev eth1
      #group: server

    ### TELEMETRY STACK ###
    gnmic:
      kind: linux
      mgmt-ipv4: 172.80.80.41
      image: ghcr.io/openconfig/gnmic:0.39.1
      binds:
        - configs/gnmic/gnmic-config.yml:/gnmic-config.yml:ro
      cmd: --config /gnmic-config.yml --log subscribe
      group: "10" # group 10 is assigned to the nodes of a telemetry stack

    prometheus:
      kind: linux
      mgmt-ipv4: 172.80.80.42
      image: quay.io/prometheus/prometheus:v2.54.1
      binds:
        - configs/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      cmd: --config.file=/etc/prometheus/prometheus.yml
      ports:
        - 9090:9090
      group: "10"

    grafana:
      kind: linux
      mgmt-ipv4: 172.80.80.43
      image: grafana/grafana:11.2.0
      binds:
        - configs/grafana/datasource.yml:/etc/grafana/provisioning/datasources/datasource.yaml:ro
        - configs/grafana/dashboards.yml:/etc/grafana/provisioning/dashboards/dashboards.yaml:ro
        - configs/grafana/dashboards:/var/lib/grafana/dashboards
      ports:
        - 3000:3000
      env:
        GF_INSTALL_PLUGINS: "andrewbmchugh-flow-panel"
        # env vars to enable anonymous access
        GF_ORG_ROLE: "Admin"
        GF_ORG_NAME: "Main Org"
        GF_AUTH_ANONYMOUS_ENABLED: "true"
        GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
        GF_AUTH_ANONYMOUS: "true"
        GF_AUTH_OAUTH_AUTO_LOGIN: "true"
      group: "10"

    ### LOGGING STACK ###
    promtail:
      kind: linux
      mgmt-ipv4: 172.80.80.45
      image: grafana/promtail:3.2.0
      binds:
        - configs/promtail:/etc/promtail
      cmd: --config.file=/etc/promtail/promtail-config.yml
      ports:
        - 9080:9080

    loki:
      kind: linux
      mgmt-ipv4: 172.80.80.46
      image: grafana/loki:3.2.0
      binds:
        - configs/loki:/etc/loki
      cmd: --config.file=/etc/loki/loki-config.yml
      ports:
        - 3100:3100

  links:
    - endpoints: ["cfsa-cnt1-0001:eth1", "cfsa-cnt1-0201a:eth1"]
    - endpoints: ["cfsa-cnt1-0001:eth2", "cfsa-cnt1-0201b:eth1"]
    #- endpoints: ["cfsa-cnt1-0001:eth3", "cfsa-cnt1-0202a:eth1"]
    #- endpoints: ["cfsa-cnt1-0001:eth4", "cfsa-cnt1-0202b:eth1"]
    - endpoints: ["cfsa-cnt1-0002:eth1", "cfsa-cnt1-0201a:eth2"]
    - endpoints: ["cfsa-cnt1-0002:eth2", "cfsa-cnt1-0201b:eth2"]
    #- endpoints: ["cfsa-cnt1-0002:eth3", "cfsa-cnt1-0202a:eth2"]
    #- endpoints: ["cfsa-cnt1-0002:eth4", "cfsa-cnt1-0202b:eth2"]
    - endpoints: ["cfsa-cnt1-0201a:eth3", "client1:eth1"]
    - endpoints: ["cfsa-cnt1-0201b:eth3", "client2:eth1"]
    #- endpoints: ["cfsa-cnt1-0202a:eth3", "client3:eth1"]
